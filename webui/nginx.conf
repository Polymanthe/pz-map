include /etc/nginx/modules/*.conf;

user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request $status $body_bytes_sent "$http_referer"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    open_file_cache max=20000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 512;
    brotli_types application/javascript application/json image/svg+xml text/css text/plain;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        location = /map-manifest.json {
            alias /srv/pz-map/map-manifest.json;
            add_header Cache-Control "no-cache" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /tiles/ {
            alias /srv/pz-map/tiles/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location ^~ /socket.io/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 75s;
        }

        location ~* \.(?:css|js)$ {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
