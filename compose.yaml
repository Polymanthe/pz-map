services:
  web:
    image: pz-map-web:local
    build:
      context: .
      dockerfile: webui/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: "${MAP_DIST:-./dist/map}"
        target: /srv/pz-map
        read_only: true

  server:
    image: pz-map-server:local
    build:
      context: ./server
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://[::1]:8080}"
      MAX_SESSIONS: "${MAX_SESSIONS:-1000}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-86400000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 10

  renderer:
    image: pz-map-renderer:local
    build:
      context: .
      dockerfile: pipeline/Dockerfile
      args:
        PZMAP2DZI_COMMIT: d682149cf805b556960cae71487c61cfd4683947
    volumes:
      - type: bind
        source: "${PZ_ROOT:-./dist/game-assets}"
        target: /game
        read_only: true
      - type: bind
        source: "${SPIKE_OUTPUT:-./dist/pipeline/spike}"
        target: /output
